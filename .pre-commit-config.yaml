default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Usa el python del PATH: hay que hacer push con el venv activado.
      - id: pytest
        name: pytest (requiere el venv activado)
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Mensajes de commit: "[#<issue>] <descripción corta>".
      # Se permiten los mensajes que genera git (Merge, Revert, fixup!/squash!/amend!).
      - id: formato-commit
        name: formato del mensaje de commit ([#n] descripción)
        entry: '\A(?!\[#[0-9]+\] \S|Merge |Revert |(fixup|squash|amend)! )'
        language: pygrep
        args: [--multiline]
        stages: [commit-msg]
