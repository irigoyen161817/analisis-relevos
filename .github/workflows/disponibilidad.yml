name: Disponibilidad

# Actualiza el campo «Disponibilidad» del Project y las dependencias de «Depende de».
on:
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:
  schedule:
    # Los cambios de dependencias hechos desde la web no lanzan ningún evento.
    - cron: "17 5 * * *"

concurrency:
  group: disponibilidad

permissions: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar el Project
        env:
          # El GITHUB_TOKEN no puede escribir en un Project de usuario.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secret PROJECT_TOKEN (ver CONTRIBUTING.md)"
            exit 1
          fi
          python3 scripts/disponibilidad.py
